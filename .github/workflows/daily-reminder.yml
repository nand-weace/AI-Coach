name: Daily CSV run
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python custom_email.py
      - uses: actions/upload-artifact@v4
        with:
          name: output-${{ github.run_number }}
          path: output/